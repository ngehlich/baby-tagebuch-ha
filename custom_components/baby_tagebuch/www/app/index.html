<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baby-Tagebuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Baby-Tagebuch</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#22201d;--mute:#77716a;--line:#e4ded5;--acc:#2f6f6a;--acc2:#c56b3c;--l:#3b6fb6;--r:#b6553b;--warn:#b3261e;--ok:#2e7d4f;--chip:#efe9e0}
body.night{--bg:#000;--card:#120606;--ink:#d46a5a;--mute:#8a4038;--line:#2a0e0b;--acc:#c0473a;--acc2:#c0473a;--l:#b04a3e;--r:#d06050;--warn:#ff6b5a;--ok:#b05a48;--chip:#1e0907}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:13px;color:var(--mute);font-weight:400}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:15px}
main{padding:12px 16px 110px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:9px 0 10px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600;letter-spacing:.02em}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.big{font-size:26px;font-weight:700}
.mute{color:var(--mute);font-size:13px}
.warnbox{border-left:4px solid var(--warn);padding:8px 10px;background:var(--chip);border-radius:8px;font-size:14px;margin:8px 0}
.okbox{border-left:4px solid var(--ok);padding:8px 10px;background:var(--chip);border-radius:8px;font-size:14px;margin:8px 0}
button.b{border:0;border-radius:12px;padding:14px 10px;font-size:16px;font-weight:600;background:var(--chip);color:var(--ink);min-height:52px}
button.b.pri{background:var(--acc);color:#fff}
button.b.L{background:var(--l);color:#fff}
button.b.R{background:var(--r);color:#fff}
button.b.sm{padding:8px 10px;min-height:38px;font-size:14px}
button.b.danger{background:var(--warn);color:#fff}
body.night button.b.pri,body.night button.b.L,body.night button.b.R,body.night button.b.danger{color:#000}
.timer{font-variant-numeric:tabular-nums;font-size:44px;font-weight:700;text-align:center;margin:4px 0}
.sides{display:flex;justify-content:space-around;font-variant-numeric:tabular-nums;margin-bottom:8px}
.sides div{text-align:center}
.sides b{display:block;font-size:20px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat div{background:var(--chip);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px}
.list .day{font-weight:700;margin:16px 0 6px;color:var(--mute);font-size:14px}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.item .t{font-variant-numeric:tabular-nums;color:var(--mute);width:46px;font-size:14px}
.item .d{flex:1}
.item .ic{font-size:20px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:22px;height:22px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 6px}
svg text{fill:var(--mute);font-size:10px}
.saved{font-size:12px;color:var(--ok)}
.u{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.u .n{font-weight:700;width:38px}
.u .w{flex:1;font-size:14px}
.pill{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px;background:var(--chip)}
.pill.now{background:var(--acc2);color:#fff}
.pill.done{background:var(--ok);color:#fff}
.pill.late{background:var(--warn);color:#fff}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:30;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">Baby</h1>
  <span class="saved" id="savedMark"></span>
  <button class="iconbtn" id="undoBtn" onclick="undo()" disabled style="opacity:.35">↶</button>
  <button class="iconbtn" id="nightBtn" title="Nachtmodus">🌙</button>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-v="heute"><span>🏠</span>Heute</button>
  <button data-v="verlauf"><span>📋</span>Verlauf</button>
  <button data-v="wachstum"><span>📈</span>Wachstum</button>
  <button data-v="statistik"><span>📊</span>Statistik</button>
  <button data-v="mehr"><span>⚙️</span>Mehr</button>
</nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">

<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
